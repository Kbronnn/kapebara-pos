<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KapeBara — Coffee Shop POS</title>
  <meta name="description"
    content="KapeBara Point of Sale system with inventory tracking and demand forecasting for coffee shops." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div id="admin-login-overlay">
    <div class="login-box">
      <div class="login-brand">
        <img src="assets/logo.jpg" alt="KapeBara Logo" class="login-logo"
          onerror="this.src='https://placehold.co/100x100?text=Logo'">
        <h1 class="login-title">KapeBara</h1>
        <p class="login-subtitle">Staff POS System</p>
      </div>
      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="admin-username" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="admin-password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary"
          style="width: 100%; justify-content: center; margin-top: 10px;">Login</button>
      </form>
      <div id="admin-login-message"
        style="margin-top: 15px; color: var(--danger); text-align: center; font-size: 0.85rem; font-weight: 500;"></div>
    </div>
  </div>

  <div id="app-content">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpg" alt="KapeBara Logo" class="brand-icon">
        <div class="brand-text">
          <span class="brand-name">KapeBara</span>
          <span class="brand-tagline">Coffee Shop POS</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-view="pos" id="nav-pos">
          <span class="nav-icon">🛒</span>
          <span class="nav-label">Point of Sale</span>
        </a>
        <a href="#" class="nav-item" data-view="inventory" id="nav-inventory">
          <span class="nav-icon">📦</span>
          <span class="nav-label">Inventory</span>
          <span class="nav-badge" id="alert-badge" style="display:none">!</span>
        </a>
        <a href="#" class="nav-item" data-view="forecast" id="nav-forecast">
          <span class="nav-icon">🔮</span>
          <span class="nav-label">Forecast</span>
        </a>
        <a href="#" class="nav-item" data-view="reports" id="nav-reports">
          <span class="nav-icon">📈</span>
          <span class="nav-label">Reports</span>
        </a>
        <a href="#" class="nav-item" data-view="menu" id="nav-menu">
          <span class="nav-icon">🍽️</span>
          <span class="nav-label">Menu</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-time" id="sidebar-time"></div>
        <div class="sidebar-date" id="sidebar-date"></div>
        <button id="admin-logout-btn"
          style="margin-top: 15px; width: 100%; padding: 8px; background: transparent; border: 1px solid rgba(241,214,171,.5); color: var(--tan); border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600; transition: all 0.2s; cursor: pointer;">
          Logout
        </button>
      </div>
    </aside>


    <main class="main-content" id="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="top-bar-right">
          <div class="top-bar-badge" id="low-stock-top" style="display:none">
            ⚠️ <span id="low-stock-count">0</span> low stock
          </div>
        </div>
      </header>


      <div id="view-dashboard" class="view active"></div>
      <div id="view-pos" class="view"></div>
      <div id="view-inventory" class="view"></div>
      <div id="view-forecast" class="view"></div>
      <div id="view-reports" class="view"></div>
      <div id="view-menu" class="view"></div>
    </main>
  </div>


  <div id="toast-container"></div>


  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/forecast.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
